[package]
name = "i-serve"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
eframe = "0.33"
if-addrs = "0.13"
percent-encoding = "2.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
